name: SOL notifikacie
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Poslať testovaciu notifikáciu'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: sol-notifikacie
  cancel-in-progress: false
jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepočítať model a poslať notifikáciu
        run: node sol-notify.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      - name: Uložiť stav signálu
        if: always()
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "sol-bot"
            git config user.email "sol-bot@users.noreply.github.com"
            git add state.json
            git commit -m "stav signálu"
            git pull --rebase --quiet || true
            git push
          fi
